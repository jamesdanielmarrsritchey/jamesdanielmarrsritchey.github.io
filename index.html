<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A simple JSON-driven personal landing page with flexible link sections.">
  <title>Static Basic Website System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="site-shell" class="site-shell">
    <section id="profile-section" class="page-section profile-section" aria-labelledby="person-name">
      <div class="theme-subsection">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
          </span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"></path>
            </svg>
          </span>
        </button>
      </div>

      <div class="section-content section-content-left profile-content">
        <div class="profile-stack">
          <div class="profile-row">
            <div class="profile-photo-wrap" aria-hidden="true">
              <span class="offset-circle"></span>
              <img class="profile-photo" src="profile.jpg" alt="">
            </div>
            <h1 id="person-name" class="person-name">John Doe</h1>
          </div>
          <div class="accent-lines" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
